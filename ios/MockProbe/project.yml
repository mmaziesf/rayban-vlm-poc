# Mock link bisect (CI only): identical source; variants differ in linked DAT products or bundle id. See docs/IOS_OPTIONS.md.
name: MockProbe
options: { bundleIdPrefix: dev.arash.probe, deploymentTarget: { iOS: "17.2" } }
packages:
  MWDAT: { url: https://github.com/facebook/meta-wearables-dat-ios, exactVersion: 1.0.1 }
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ProbeLite:
    type: application
    platform: iOS
    sources: [App]
    info: { path: App/Info.plist }
    entitlements: { path: App/Probe.entitlements, properties: { keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"] } }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.lite } }
    dependencies:
      - { package: MWDAT, product: MWDATCore }
      - { package: MWDAT, product: MWDATCamera }
      - { package: MWDAT, product: MWDATMockDevice }
  ProbeLiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.uitests.lite } }
    dependencies:
      - target: ProbeLite
      - { package: MWDAT, product: MWDATMockDeviceTestClient }
  ProbeLiteMetaId:
    type: application
    platform: iOS
    sources: [App]
    info: { path: App/Info.plist }
    entitlements: { path: App/Probe.entitlements, properties: { keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"] } }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.meta.wearables.external.CameraAccess } }
    dependencies:
      - { package: MWDAT, product: MWDATCore }
      - { package: MWDAT, product: MWDATCamera }
      - { package: MWDAT, product: MWDATMockDevice }
  ProbeLiteMetaIdUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.uitests.litemetaid } }
    dependencies:
      - target: ProbeLiteMetaId
      - { package: MWDAT, product: MWDATMockDeviceTestClient }
  ProbeDisplay:
    type: application
    platform: iOS
    sources: [App]
    info: { path: App/Info.plist }
    entitlements: { path: App/Probe.entitlements, properties: { keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"] } }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.display } }
    dependencies:
      - { package: MWDAT, product: MWDATCore }
      - { package: MWDAT, product: MWDATCamera }
      - { package: MWDAT, product: MWDATMockDevice }
      - { package: MWDAT, product: MWDATDisplay }
  ProbeDisplayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.uitests.display } }
    dependencies:
      - target: ProbeDisplay
      - { package: MWDAT, product: MWDATMockDeviceTestClient }
  ProbeSpeech:
    type: application
    platform: iOS
    sources: [App]
    info: { path: App/Info.plist }
    entitlements: { path: App/Probe.entitlements, properties: { keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"] } }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.speech } }
    dependencies:
      - { package: MWDAT, product: MWDATCore }
      - { package: MWDAT, product: MWDATCamera }
      - { package: MWDAT, product: MWDATMockDevice }
      - { package: MWDAT, product: MWDATSpeech }
  ProbeSpeechUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.uitests.speech } }
    dependencies:
      - target: ProbeSpeech
      - { package: MWDAT, product: MWDATMockDeviceTestClient }
  ProbeFull:
    type: application
    platform: iOS
    sources: [App]
    info: { path: App/Info.plist }
    entitlements: { path: App/Probe.entitlements, properties: { keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"] } }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.full } }
    dependencies:
      - { package: MWDAT, product: MWDATCore }
      - { package: MWDAT, product: MWDATCamera }
      - { package: MWDAT, product: MWDATMockDevice }
      - { package: MWDAT, product: MWDATDisplay }
      - { package: MWDAT, product: MWDATSpeech }
  ProbeFullUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.uitests.full } }
    dependencies:
      - target: ProbeFull
      - { package: MWDAT, product: MWDATMockDeviceTestClient }
  ProbeLiteEarly:
    type: application
    platform: iOS
    sources: [App]
    info: { path: App/Info.plist }
    entitlements: { path: App/Probe.entitlements, properties: { keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"] } }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.liteearly, SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MOCK_EARLY" } }
    dependencies:
      - { package: MWDAT, product: MWDATCore }
      - { package: MWDAT, product: MWDATCamera }
      - { package: MWDAT, product: MWDATMockDevice }
  ProbeLiteEarlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: dev.arash.probe.uitests.liteearly } }
    dependencies:
      - target: ProbeLiteEarly
      - { package: MWDAT, product: MWDATMockDeviceTestClient }
schemes:
  ProbeLite:
    build: { targets: { ProbeLite: all, ProbeLiteUITests: [test] } }
    test: { targets: [ProbeLiteUITests] }
  ProbeLiteMetaId:
    build: { targets: { ProbeLiteMetaId: all, ProbeLiteMetaIdUITests: [test] } }
    test: { targets: [ProbeLiteMetaIdUITests] }
  ProbeDisplay:
    build: { targets: { ProbeDisplay: all, ProbeDisplayUITests: [test] } }
    test: { targets: [ProbeDisplayUITests] }
  ProbeSpeech:
    build: { targets: { ProbeSpeech: all, ProbeSpeechUITests: [test] } }
    test: { targets: [ProbeSpeechUITests] }
  ProbeFull:
    build: { targets: { ProbeFull: all, ProbeFullUITests: [test] } }
    test: { targets: [ProbeFullUITests] }
  ProbeLiteEarly:
    build: { targets: { ProbeLiteEarly: all, ProbeLiteEarlyUITests: [test] } }
    test: { targets: [ProbeLiteEarlyUITests] }
