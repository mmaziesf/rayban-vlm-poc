# XcodeGen spec (brew install xcodegen && xcodegen). Authored on Linux; generated + built on GitHub Actions macos-15.
name: GlanceApp
options: { bundleIdPrefix: dev.arash, deploymentTarget: { iOS: "17.0" } }
packages:
  MWDAT: { url: https://github.com/facebook/meta-wearables-dat-ios, exactVersion: 1.0.1 }
  GlanceCore: { path: ../GlanceCore }
targets:
  GlanceApp:
    type: application
    platform: iOS
    sources: [Sources, Debug, Resources]   # Debug/ is #if DEBUG; TODO: exclude Resources/mock_* from Release
    # NOT `info:` + path: XcodeGen REWRITES that file with ~8 default keys (+ `properties`), silently dropping MWDAT,
    # URL scheme, Bonjour/LocalNetwork/Bluetooth keys and background modes from the built app. Use the plist as-is.
    # Same entitlement Meta's DisplayAccess/CameraAccess samples ship (we had none). Attempt for the mock link that never
    # leaves disconnected/undefined (runs 38112910442, 38113596903).
    entitlements:
      path: GlanceApp.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"]
    settings:
      base:
        # Simulator: ad-hoc "Sign to Run Locally" (no team). DAT's Wearables.configure() uses the keychain and fails with
        # internalError when the app has no application-identifier entitlement (CODE_SIGNING_ALLOWED=NO; CI run 38109145843).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: Info.plist
    dependencies:
      - package: GlanceCore
      - { package: MWDAT, product: MWDATCore }
      - { package: MWDAT, product: MWDATCamera }
      - { package: MWDAT, product: MWDATDisplay }
      - { package: MWDAT, product: MWDATSpeech }
      - { package: MWDAT, product: MWDATMockDevice }   # needed for Debug MockRig
  GlanceAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES   # required once code signing is on (run 38109885287)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: GlanceApp
      - { package: MWDAT, product: MWDATMockDeviceTestClient }
schemes:
  GlanceApp:
    build: { targets: { GlanceApp: all, GlanceAppUITests: [test] } }
    test: { targets: [GlanceAppUITests] }
