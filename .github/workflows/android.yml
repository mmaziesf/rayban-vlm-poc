# Android (primary) build + HP Lifestyle bridge contract. Public repo → free ubuntu minutes.
name: android
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (+ write HPL contract file)
        run: cd phone && HPL_CONTRACT_OUT=$RUNNER_TEMP/contract.hplevent ./gradlew --no-daemon :core:coreTests
      - name: HPL contract (HMAC + schemas, Python reference)
        run: |
          pip install --quiet jsonschema
          python3 tools/hpl/check_contract.py "$RUNNER_TEMP/contract.hplevent"
          python3 tools/hpl/hpl_event_sign.py verify tools/hpl/01-glance-meal.synthetic.hplevent
      - name: Assemble debug, release, androidTest
        run: cd phone && ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Offline guard (release APK has no INTERNET permission)
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          APK=$(ls phone/app/build/outputs/apk/release/*.apk | head -1)
          $AAPT dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "::error::release APK requests INTERNET"; exit 1; fi
