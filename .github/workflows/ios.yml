# github.com/mmaziesf/rayban-vlm-poc Actions (public repo → free macOS minutes).
name: ios
on: [push, workflow_dispatch]
jobs:
  core-linux:            # same thing the bot box runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.1" }
      - run: cd ios/GlanceCore && swift test
  app-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios/GlanceCore && swift test
      - run: cd ios/GlanceApp && xcodegen
      - name: Pick (or create) an iPhone simulator
        id: sim
        run: |
          # Runner images sometimes list no "iPhone 16" (run 38110449565) → choose any available iPhone, else create one.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,xs in d.items() if "iOS" in r for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:(t[0],t[1]["name"]))
          print(c[-1][1]["udid"] if c else "")')
          if [ -z "$UDID" ]; then
            rt(){ xcrun simctl list runtimes -j | python3 -c 'import json,sys;r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]];print(r[-1]["identifier"] if r else "")'; }
            RT=$(rt)
            if [ -z "$RT" ]; then echo "no iOS runtime on runner → downloading (slow)"; sudo xcodebuild -downloadPlatform iOS; RT=$(rt); fi
            DT=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;t=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")];print(t[-1]["identifier"])')
            echo "creating simulator $DT / $RT"; UDID=$(xcrun simctl create GlanceCI "$DT" "$RT")
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"; xcrun simctl list devices | grep "$UDID"
      - name: Build app + UI tests for Simulator (gate)
        run: |
          set -o pipefail
          cd ios/GlanceApp
          xcodebuild build-for-testing -project GlanceApp.xcodeproj -scheme GlanceApp \
            -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES | tee build.log
      - name: "UI tests: DAT MockDeviceKit link (known blocker, non-gating — docs/IOS_OPTIONS.md)"
        id: uitests
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios/GlanceApp
          UDID='${{ steps.sim.outputs.udid }}'
          mkdir -p diag
          # Pre-boot + stream the app's log for the whole test run (log show after the run finds no booted device).
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          xcrun simctl spawn "$UDID" log stream --style compact --level debug \
            --predicate 'process == "GlanceApp"' > diag/app.log 2>&1 &
          echo $! > diag/logstream.pid
          xcodebuild test-without-building -project GlanceApp.xcodeproj -scheme GlanceApp \
            -destination "id=$UDID" -resultBundlePath UITests.xcresult -only-testing:GlanceAppUITests/MockLoopUITests \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES | tee xcodebuild.log
      - name: "UI tests: controller/HUD via --fake-glasses (gate; no DAT link)"
        run: |
          set -o pipefail
          cd ios/GlanceApp
          xcodebuild test-without-building -project GlanceApp.xcodeproj -scheme GlanceApp \
            -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath FakeUITests.xcresult \
            -only-testing:GlanceAppUITests/FakeGlassesUITests \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES | tee xcodebuild-fake.log
      - name: Diagnostics (crash reports, app log, xcresult)
        if: always()
        run: |
          cd ios/GlanceApp
          echo "::group::Test summary"
          xcrun xcresulttool get test-results summary --path UITests.xcresult --compact 2>&1 | tee summary.json | head -c 6000 || true
          echo; echo "::endgroup::"
          echo "::group::Failures"
          grep -E "error: -\[|status was|HUD never" xcodebuild.log xcodebuild-fake.log | head -40 || true
          echo "--- fake-glasses suite:"; xcrun xcresulttool get test-results summary --path FakeUITests.xcresult --compact 2>&1 | head -c 3000 || true
          echo "::endgroup::"
          echo "::group::Crash reports (GlanceApp)"
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i glance | head -3); do
            cp ~/Library/Logs/DiagnosticReports/"$f" diag/ ; echo "=== $f"; head -c 12000 ~/Library/Logs/DiagnosticReports/"$f"; echo
          done
          echo "::endgroup::"
          echo "::group::App log (GlanceDiag / GlanceHud / faults)"
          kill "$(cat diag/logstream.pid 2>/dev/null)" 2>/dev/null || true
          grep -aE "GlanceDiag|GlanceHud|MWDAT|Fatal|assert" diag/app.log | tail -200 || true
          echo "::endgroup::"
          echo "::group::Mock bring-up probe (--mock-probe; diagnostic, not a test)"
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl terminate "$UDID" dev.arash.GlanceApp 2>/dev/null || true
          xcrun simctl launch "$UDID" dev.arash.GlanceApp --mock-probe || echo "probe launch failed"
          sleep 55   # 4 variants × ≤8.5 s
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "PROBE"' > diag/probe.log 2>&1 || true
          grep -a "PROBE" diag/probe.log || { echo "no PROBE lines"; tail -20 diag/probe.log; }
          echo "::endgroup::"
          xcrun xcresulttool export attachments --path UITests.xcresult --output-path diag/attachments >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs
          path: |
            ios/GlanceApp/*.log
            ios/GlanceApp/summary.json
            ios/GlanceApp/diag
            ios/GlanceApp/UITests.xcresult
            ios/GlanceApp/FakeUITests.xcresult
  dat-sample-control:    # CONTROL (non-gating). Meta's samples say "Xcode 26.4+"; app-simulator builds with Xcode 16.4 (macos-15 default).
    runs-on: macos-26    # (1) Meta's own CameraAccess XCUITest (mock pair → active device), (2) OUR MockLoopUITests, both on Xcode 26.
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - run: git clone --depth 1 https://github.com/facebook/meta-wearables-dat-ios dat && git -C dat log -1 --format='%h %cd'
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,xs in d.items() if "iOS" in r for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:(t[0],t[1]["name"]))
          print(c[-1][1]["udid"] if c else "")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"; xcrun simctl list devices | grep "$UDID"
      - name: "Control 1: Meta CameraAccess UI tests (mock pair → active device)"
        run: |
          set -o pipefail
          cd dat/samples/CameraAccess
          xcodebuild test -project CameraAccess.xcodeproj -scheme CameraAccess \
            -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath $GITHUB_WORKSPACE/Control.xcresult \
            -only-testing:CameraAccessUITests/CameraAccessUITests/testLaunchWithoutDeviceShowsHomeScreen \
            -only-testing:CameraAccessUITests/CameraAccessUITests/testRegisterAndPairShowsCameraScreen \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee $GITHUB_WORKSPACE/control.log | grep -E "Test Case|error:|\*\* TEST"
      - name: "Control 2: GlanceApp MockLoopUITests built with Xcode 26"
        if: always()
        run: |
          set -o pipefail
          brew install xcodegen
          cd ios/GlanceApp && xcodegen
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'eventMessage CONTAINS "GlanceDiag: MDK"' > $GITHUB_WORKSPACE/x26-app.log 2>&1 &
          xcodebuild build-for-testing -project GlanceApp.xcodeproj -scheme GlanceApp -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES 2>&1 | tail -5
          xcodebuild test-without-building -project GlanceApp.xcodeproj -scheme GlanceApp -destination "id=$UDID" \
            -only-testing:GlanceAppUITests/MockLoopUITests -resultBundlePath $GITHUB_WORKSPACE/X26.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES 2>&1 | grep -E "Test Case|status was|\*\* TEST"
      - name: Control summary
        if: always()
        run: |
          echo "== CameraAccess"; xcrun xcresulttool get test-results summary --path Control.xcresult --compact 2>/dev/null | head -c 3000 || true
          grep -E "error:|requires a development team" control.log | head -20 || true
          echo; echo "== GlanceApp MockLoop (Xcode 26)"; xcrun xcresulttool get test-results summary --path X26.xcresult --compact 2>/dev/null | head -c 3000 || true
          echo; grep -a "GlanceDiag" x26-app.log | head -30 || true
