# NOT RUN. Needs the repo on GitHub (free macOS minutes if public; $0.062/min if private).
name: ios
on: [push, workflow_dispatch]
jobs:
  core-linux:            # same thing the bot box runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.1" }
      - run: cd ios/GlanceCore && swift test
  app-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios/GlanceCore && swift test
      - run: cd ios/GlanceApp && xcodegen
      - name: Build app + UI tests for Simulator (gate)
        run: |
          set -o pipefail
          cd ios/GlanceApp
          xcodebuild build-for-testing -project GlanceApp.xcodeproj -scheme GlanceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: UI tests (MockDeviceKit, no glasses)
        id: uitests
        run: |
          set -o pipefail
          cd ios/GlanceApp
          xcodebuild test-without-building -project GlanceApp.xcodeproj -scheme GlanceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: Diagnostics (crash reports, app log, xcresult)
        if: always()
        run: |
          cd ios/GlanceApp
          echo "::group::Test summary"
          xcrun xcresulttool get test-results summary --path UITests.xcresult --compact 2>&1 | tee summary.json | head -c 6000 || true
          echo; echo "::endgroup::"
          echo "::group::Failures"
          grep -E "error: -\[|status was|HUD never" xcodebuild.log | head -40 || true
          echo "::endgroup::"
          echo "::group::Crash reports (GlanceApp)"
          mkdir -p diag
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i glance | head -3); do
            cp ~/Library/Logs/DiagnosticReports/"$f" diag/ ; echo "=== $f"; head -c 12000 ~/Library/Logs/DiagnosticReports/"$f"; echo
          done
          echo "::endgroup::"
          echo "::group::App log (GlanceDiag / GlanceHud / faults)"
          xcrun simctl spawn booted log show --last 30m --style compact \
            --predicate 'process == "GlanceApp" AND (eventMessage CONTAINS "Glance" OR messageType == 16 OR messageType == 17)' \
            > diag/app.log 2>&1 || true
          grep -E "GlanceDiag|GlanceHud|Fatal|fault|error" diag/app.log | tail -150 || true
          echo "::endgroup::"
          xcrun xcresulttool export attachments --path UITests.xcresult --output-path diag/attachments >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs
          path: |
            ios/GlanceApp/*.log
            ios/GlanceApp/summary.json
            ios/GlanceApp/diag
            ios/GlanceApp/UITests.xcresult
