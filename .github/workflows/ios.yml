# NOT RUN. Needs the repo on GitHub (free macOS minutes if public; $0.062/min if private).
name: ios
on: [push, workflow_dispatch]
jobs:
  core-linux:            # same thing the bot box runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.1" }
      - run: cd ios/GlanceCore && swift test
  app-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios/GlanceCore && swift test
      - run: cd ios/GlanceApp && xcodegen
      - name: Build + UI tests (MockDeviceKit, no glasses)
        run: |
          cd ios/GlanceApp
          xcodebuild test -project GlanceApp.xcodeproj -scheme GlanceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO TIMEOUT_SCALE=2 | tee xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-logs, path: ios/GlanceApp/xcodebuild.log }
